<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#141B2D"/>
      <stop offset="100%" stop-color="#08090B"/>
    </radialGradient>

    <!-- Electric Circuit Gradient for Sandipan 'S' -->
    <linearGradient id="sandipanElectric" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="75%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="electricGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Enclosure (Streaming & Engineering aesthetic) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#3B82F6" stroke-opacity="0.35" stroke-width="2"/>
  
  <!-- Subtle Internal Circuit Grid Lines -->
  <path d="M 6 20 H 14 M 50 44 H 58 M 20 6 V 14 M 44 50 V 58" stroke="#3B82F6" stroke-opacity="0.25" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sandipan Samanta 'SS' Circuit-Lightning Monogram -->
  <!-- Primary Outer 'S' Lightning Path -->
  <path 
    d="M 44 18 H 22 C 18 18 15 21 15 25 C 15 29 18 32 23 33 L 41 36 C 46 37 49 40 49 44 C 49 48 46 51 42 51 H 20" 
    stroke="url(#sandipanElectric)" 
    stroke-width="5.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#electricGlow)"
  />

  <!-- High-Voltage Energy Spark through the central diagonal of the 'S' -->
  <path 
    d="M 36 21 L 24 37 H 34 L 28 47" 
    stroke="#FFFFFF" 
    stroke-width="2.2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- PCB Node Solder Terminals (Symbolizing Electrical Engineering & Initials) -->
  <circle cx="44" cy="18" r="3" fill="#22D3EE" stroke="#08090B" stroke-width="1.5"/>
  <circle cx="20" cy="51" r="3" fill="#3B82F6" stroke="#08090B" stroke-width="1.5"/>
  
  <!-- Micro Core Spark Point -->
  <circle cx="34" cy="37" r="1.5" fill="#FFFFFF"/>
</svg>
